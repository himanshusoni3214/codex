# Place the following inside the http { } block:
# sendfile on;
# tcp_nopush on;
# tcp_nodelay on;
# keepalive_timeout 65;
# keepalive_requests 1000;
# types_hash_max_size 2048;
# server_tokens off;
# client_max_body_size 50m;
# client_body_buffer_size 256k;
# fastcgi_buffers 16 16k;
# fastcgi_buffer_size 32k;
# fastcgi_busy_buffers_size 64k;
# fastcgi_read_timeout 60s;
# fastcgi_cache_path /var/cache/nginx/naturalgem levels=1:2 keys_zone=NATURALGEM:10m inactive=60m max_size=2g;

server {
    listen 443 ssl http2;
    server_name naturalgem.com www.naturalgem.com;

    root /var/www/naturalgem/public;
    index index.php;

    # Microcache skip rules
    set $skip_cache 0;
    if ($request_method = POST) { set $skip_cache 1; }
    if ($query_string != "") { set $skip_cache 1; }
    if ($request_uri ~* "/(admin|login|horizon)") { set $skip_cache 1; }

    # SSL certs (configure with certbot)
    ssl_certificate /etc/letsencrypt/live/naturalgem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naturalgem.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Uploads
    client_max_body_size 50m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Brotli (requires nginx-module-brotli)
    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static assets caching
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|avif|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_read_timeout 60s;

        # Microcache (optional)
        fastcgi_cache NATURALGEM;
        fastcgi_cache_valid 200 1s;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        add_header X-Cache $upstream_cache_status;
    }

    # Prevent access to hidden files
    location ~ /\. {
        deny all;
    }
}
